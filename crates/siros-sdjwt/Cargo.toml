[package]
name = "siros-sdjwt"
version = "0.1.0"
description = "The SD-JWT VC format plug-in of the SIROS wallet core: OpenID4VP 1.0 B.3, dc+sd-jwt"
edition = "2024"
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["resolve"]
# Phase 2: the presentation.
resolve = ["siros-openid4vp/resolve", "dep:base64", "dep:rustc-hash", "dep:sha2"]

[dependencies]
siros-openid4vp = { workspace = true, features = ["claims"] }
base64 = { workspace = true, optional = true }
rustc-hash = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
thiserror = { workspace = true }
siros-explain = { workspace = true }

[dev-dependencies]
siros-sdjwt = { path = ".", features = ["resolve"] }
base64 = { workspace = true }
sha2 = { workspace = true }
siros-openid4vp = { workspace = true, features = ["resolve"] }
siros-testkit = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }

[lints]
workspace = true
