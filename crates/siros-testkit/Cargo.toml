[package]
name = "siros-testkit"
version = "0.1.0"
description = "Test plug-ins, deterministic doubles of the core's host modules, the Verifier's encoders and test certificates, for the tests of the SIROS wallet core crates"
edition = "2024"
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# The doubles of every mechanism the core holds.
siros-openid4vp = { workspace = true, features = [
    "resolve",
    "dc-api",
    "request-decryption",
    "cbor",
    "sha3",
    "blake2",
    "k12",
    "sri",
    "claims",
] }
serde_json = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
rustc-hash = { workspace = true }
hmac = { workspace = true }
thiserror = { workspace = true }
siros-explain = { workspace = true }
siros-syntax = { workspace = true }
# The test app's contexts, with the functions its wording calls.
siros-i18n = { workspace = true, features = ["number", "currency", "date", "derive"] }
p256 = { workspace = true, features = ["ecdsa", "ecdh"] }
aes-gcm = { workspace = true }
miniz_oxide = { workspace = true }

[lints]
workspace = true
