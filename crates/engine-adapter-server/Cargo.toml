[package]
name = "engine-adapter-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false
description = "The standalone container host of the Rust WMP engine: HTTP+SSE transport, session management, health probes — the drop-in replacement for go-wallet-backend --mode=engine"

[dependencies]
wmp-core = { path = "../wmp-core" }
# The MLS provider (the `mls` feature): the OpenMLS-backed cryptography.
wmp-mls = { path = "../wmp-mls", optional = true }
engine-core = { path = "../engine-core" }
engine-ports = { path = "../engine-ports" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
axum = { version = "0.8", features = ["ws"] }
serde = { workspace = true }
serde_json = { workspace = true }
rustc-hash = { workspace = true }
jose-rs = { version = "0.13.1", default-features = false }
# The well-known's signed form (issue #100): the x5c chain entries are
# standard-alphabet base64 DER (RFC 7515 §4.1.6), and the PEM chain
# parse is a base64 body decode.
base64 = "0.23"
ureq = { version = "2", features = ["json"] }
# The PKCS#11 credential (issue #100, the `pkcs11` feature): kryptering's
# token-backed signer — CS-15 §8.4's WSCA/QSCD, the key never leaves the
# token. Optional and off by default, so the default build keeps the
# workspace's rustcrypto-only kryptering pin; the pkcs11 feature turns
# kryptering's own pkcs11 module on for this build.
kryptering = { version = "0.7", default-features = false, features = [
    "rustcrypto",
], optional = true }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
parking_lot = "0.12"
async-trait = "0.1"
thiserror = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
futures-util = "0.3"
tokio-tungstenite = "0.24"
dashmap = { version = "6", optional = true }
# The Valkey client (issue #65): "an async client for Redis and Valkey" -
# RESP-compatible either way; Valkey is the open source store this
# deployment targets. Feature-gated behind `valkey`.
fred = { version = "10", default-features = false, features = ["enable-rustls", "i-pubsub", "i-lists", "i-hashes", "i-keys", "i-sets"], optional = true }

[[bin]]
name = "engine-server"
path = "src/main.rs"

[dev-dependencies]
# The well-known signed-form tests (issue #100): real self-signed
# participant certificates to sign the document under.
rcgen = "0.14"

[features]
# The Valkey-backed shared outbox (issue #65): a multi-replica deployment
# backs the event log with a shared store - a Valkey server (the
# RESP-compatible open source store) via fred. The memory log stays the
# default.
valkey = ["dep:fred", "dep:dashmap"]
# The MLS group encryption (the wmp-mls spec, RFC 9420): the OpenMLS-backed
# provider + the handler bridge, the MlsProfile registered on the peer.
# Rides wmp-mls's 0.10 line (the MSRV 1.94 floor matches the workspace's).
mls = ["dep:wmp-mls"]
# The PKCS#11 participant credential (issue #100): the signing key lives
# on a token — CS-15 §8.4's WSCA/QSCD — and kryptering's Pkcs11Signer
# signs through the same jose-rs JWS layer the software credential rides.
pkcs11 = ["dep:kryptering", "kryptering/pkcs11"]

[lints]
workspace = true

# The MLS surface's e2e: the `mls` feature gates the profile registration,
# so the suite is feature-gated too (the default build skips it).
[[test]]
name = "mls_e2e"
required-features = ["mls"]
