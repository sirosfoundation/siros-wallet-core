[package]
name = "engine-adapter-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false
description = "The standalone container host of the Rust WMP engine: HTTP+SSE transport, session management, health probes — the drop-in replacement for go-wallet-backend --mode=engine"

[dependencies]
wmp-core = { path = "../wmp-core" }
engine-ports = { path = "../engine-ports" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
axum = { version = "0.8", features = ["ws"] }
serde = { workspace = true }
serde_json = { workspace = true }
rustc-hash = { workspace = true }
tokio-stream = "0.1"
tower = { version = "0.5", features = ["util"] }
futures-util = "0.3"
tokio-tungstenite = "0.24"

[[bin]]
name = "engine-server"
path = "src/main.rs"

[lints]
workspace = true
