[package]
name = "siros-trust"
version = "0.11.0"
description = "Issuer trust for the SIROS wallet core: the trust store, issuer chains, and the resolution of DCQL trusted_authorities"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
# The core's DCQL queries and identifiers; the instants are the core's `Timestamp`, which its
# `resolve` holds.
siros-openid4vp = { workspace = true, features = ["match", "resolve"] }
base64 = { workspace = true }
thiserror = { workspace = true }
der = { workspace = true }
p256 = { workspace = true, features = ["ecdsa"] }
p384 = { workspace = true, features = ["ecdsa"] }
x509-cert = { workspace = true }

# The tests build their certificates with x509-cert's builder.
[dev-dependencies]
p256 = { workspace = true, features = ["ecdsa", "alloc", "pkcs8"] }
p384 = { workspace = true, features = ["ecdsa", "alloc", "pkcs8"] }
x509-cert = { workspace = true, features = ["builder"] }
sha2 = { workspace = true, features = ["oid"] }
serde_json = { workspace = true }
base64 = { workspace = true }

[lints]
workspace = true
