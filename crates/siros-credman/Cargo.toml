[package]
name = "siros-credman"
version = "0.1.0"
description = "Android Credential Manager's entries for the SIROS wallet core's matcher: the Standard and Payment entries of a consent entry, the delegation of a set (A9, K4), and the registration the matcher reads its wording from"
edition = "2024"
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
publish = false

[features]
# The registration writer, which the wallet links.
register = []

[dependencies]
siros-openid4vp = { workspace = true, features = ["match"] }
siros-explain = { workspace = true }
# The matcher's context. The build that links the matcher picks the format functions.
siros-i18n = { workspace = true }
siros-syntax = { workspace = true }
thiserror = { workspace = true }
# The extended grapheme clusters a field's cut keeps whole.
unicode-segmentation = { workspace = true }

[dev-dependencies]
siros-credman = { path = ".", features = ["register"] }
siros-testkit = { workspace = true }

[lints]
workspace = true
