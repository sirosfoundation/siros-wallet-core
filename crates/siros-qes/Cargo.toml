[package]
name = "siros-qes"
version = "0.1.0"
description = "The CSC QES approval transaction data profile for the SIROS wallet core: request rules, rendering, binding and phase 2"
edition = "2024"
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["resolve", "sha3"]
# Phase 2: the documents' revalidation, its findings, and the qesApproval response member.
resolve = ["siros-openid4vp/resolve"]
# The SHA-3 approval hashes (CSC §7.2, NIST CSOR 2.16.840.1.101.3.4.2.7 to .10).
sha3 = ["dep:sha3"]

[dependencies]
siros-openid4vp = { workspace = true, features = ["sri"] }
base64 = { workspace = true }
sha2 = { workspace = true }
sha3 = { workspace = true, optional = true }
thiserror = { workspace = true }
siros-explain = { workspace = true }
rustc-hash = { workspace = true }

[dev-dependencies]
siros-openid4vp = { workspace = true, features = ["resolve", "test-util"] }
siros-testkit = { workspace = true }
# The placements the tests' credentials take from their formats' plug-ins.
siros-mdoc = { workspace = true }
siros-sdjwt = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }

[lints]
workspace = true
