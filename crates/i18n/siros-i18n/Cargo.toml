[package]
name = "siros-i18n"
version = "0.1.0"
description = "The wallet core's messages and their wording: MessageFormat 2 resources resolved into styled text"
edition = "2024"
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["derive"]
# `#[derive(Message)]`.
derive = ["dep:siros-i18n-derive"]
# Test builds only: `Context::check` and every derived statement's row.
check = ["siros-explain/check", "dep:inventory"]

[dependencies]
siros-explain = { workspace = true }
siros-i18n-derive = { workspace = true, optional = true }
thiserror = { workspace = true }
rustc-hash = { workspace = true }
inventory = { workspace = true, optional = true }

[dev-dependencies]
# The tests derive statements and check wordings whatever the build's features: cargo turns a
# package's dev-dependency features on in its own test builds alone.
siros-i18n = { path = ".", features = ["derive", "check"] }
thiserror = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }

[lints]
workspace = true
