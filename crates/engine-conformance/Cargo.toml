[package]
name = "engine-conformance"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false
description = "The vector runner: loads the engine-vectors repository's scenarios and runs them against the engine core"

[dependencies]
wmp-core = { path = "../wmp-core" }
engine-ports = { path = "../engine-ports" }
engine-core = { path = "../engine-core" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rustc-hash = { workspace = true }
async-trait = "0.1"
regex = "1"
# The encrypted-reply vector feature: a world that answers the
# credential request with a JWE to the key the engine offered.
jose-rs = { version = "0.10", default-features = false }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }

[lints]
workspace = true
