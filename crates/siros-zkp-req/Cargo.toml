[package]
name = "siros-zkp-req"
version = "0.11.0"
description = "The zkp_req protocol layer: queries, options, system selection and the presentation encoding"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
# Reading the presentations of a query from a JSON `vp_token`.
vp-token = []

[dependencies]
# The core's DCQL reader, CBOR, JSON with unique member names and identifiers.
siros-openid4vp = { workspace = true, features = ["resolve"] }
base64 = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
siros-openid4vp = { workspace = true, features = ["resolve"] }

[lints]
workspace = true
