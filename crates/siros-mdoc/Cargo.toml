[package]
name = "siros-mdoc"
version = "0.1.0"
description = "The mdoc format plug-in of the SIROS wallet core: OpenID4VP 1.0 B.2, mso_mdoc"
edition = "2024"
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["resolve"]
# Phase 2: the presentation. The crate's phase-2 code follows the core's `resolve`
# (`siros_openid4vp::with_resolve!`), whichever crate enables it.
resolve = ["siros-openid4vp/resolve"]
# The `DeviceMac` double for the tests of crates that register siros-mdoc.
test-util = ["resolve"]

[dependencies]
siros-openid4vp = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
siros-explain = { workspace = true }
# The stored mdoc's value digests (ISO/IEC 18013-5, 9.1.2.5) and its device signing input.
sha2 = { workspace = true }
rustc-hash = { workspace = true }

[dev-dependencies]
siros-mdoc = { path = ".", features = ["test-util"] }
siros-openid4vp = { workspace = true, features = ["resolve"] }
siros-testkit = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }

[lints]
workspace = true
