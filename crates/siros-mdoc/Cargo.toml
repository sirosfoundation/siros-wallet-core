[package]
name = "siros-mdoc"
version = "0.1.0"
description = "The mdoc format plug-in of the SIROS wallet core: OpenID4VP 1.0 B.2, mso_mdoc"
edition = "2024"
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["resolve"]
# Phase 2: the presentation, in ISO/IEC 18013-5's CBOR and COSE.
resolve = [
    "siros-openid4vp/resolve",
    "siros-openid4vp/cbor",
    "dep:base64",
    "dep:sha2",
    "dep:rustc-hash",
]
# The `DeviceMac` double for the tests of crates that register siros-mdoc.
test-util = ["resolve"]

[dependencies]
siros-openid4vp = { workspace = true, features = ["claims"] }
base64 = { workspace = true, optional = true }
thiserror = { workspace = true }
siros-explain = { workspace = true }
# The stored mdoc's value digests (ISO/IEC 18013-5, 9.1.2.5) and its device signing input.
sha2 = { workspace = true, optional = true }
rustc-hash = { workspace = true, optional = true }

[dev-dependencies]
base64 = { workspace = true }
siros-mdoc = { path = ".", features = ["test-util"] }
siros-openid4vp = { workspace = true, features = ["resolve"] }
siros-testkit = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }

[lints]
workspace = true
