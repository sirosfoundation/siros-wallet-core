[package]
name = "engine-adapter-sdk"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false
description = "The UniFFI bindings of the WMP engine core for Kotlin and Swift — the P0.4 async smoke of the engine's port shapes"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "engine_adapter_sdk"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
default = ["tokio-runtime"]
bindgen = ["dep:uniffi", "uniffi/cli"]
tokio-runtime = ["dep:tokio", "dep:uniffi", "uniffi/tokio"]

[dependencies]
engine-core = { path = "../engine-core" }
engine-ports = { path = "../engine-ports" }
wmp-core = { path = "../wmp-core" }
rustc-hash = { workspace = true }
serde_json = { workspace = true }
async-trait = "0.1"
parking_lot = "0.12"
uniffi = { version = "0.28", optional = true }
tokio = { version = "1", features = ["rt", "time", "rt-multi-thread"], optional = true }

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["rt", "time", "rt-multi-thread", "macros"] }
