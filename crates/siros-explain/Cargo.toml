[package]
name = "siros-explain"
version = "0.1.0"
description = "Errors a wallet words: a stable identifier and named arguments"
edition = "2024"
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["derive"]
# `#[derive(Explain)]`, beside `#[derive(thiserror::Error)]`.
derive = ["dep:siros-explain-derive"]
# Test builds only: every derived id registers a row, which `check::rows` reads.
check = ["dep:inventory"]

[dependencies]
siros-explain-derive = { workspace = true, optional = true }
inventory = { workspace = true, optional = true }

[dev-dependencies]
# The tests and the examples use the derive whatever the build's features.
siros-explain = { path = ".", features = ["derive"] }
thiserror = { workspace = true }

[lints]
workspace = true
