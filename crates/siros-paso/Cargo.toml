[package]
name = "siros-paso"
version = "0.1.0"
description = "The PaSO transaction data profile for the SIROS wallet core: every urn:paso:sca: type, its request rules, rendering, first match, risk signals and phase 2"
edition = "2024"
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["resolve"]
# Phase 2: revalidation of what the matcher assumed, its findings, and the SCA response members.
resolve = ["siros-openid4vp/resolve", "dep:uuid"]
# The `COSE_Encrypt` sealing of an mdoc's risk signals (Risk Signals §7.6) and its `CoseEncrypt`
# module. Without it, an mdoc entry whose signals need encryption is refused (`NotCompatible::Lacks`).
sealed-signals = ["siros-openid4vp/cbor"]
# The `Paso`, `RandomIds` and, with `sealed-signals`, `CoseEncrypt` doubles for the tests of crates
# that register siros-paso.
test-util = ["resolve"]

[dependencies]
siros-openid4vp = { workspace = true, features = ["transaction-data", "sri"] }
base64 = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
thiserror = { workspace = true }
siros-explain = { workspace = true }
rustc-hash = { workspace = true }
unicode-segmentation = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true, optional = true }

[dev-dependencies]
siros-paso = { path = ".", features = ["test-util", "sealed-signals"] }
siros-openid4vp = { workspace = true, features = ["resolve", "test-util"] }
siros-testkit = { workspace = true }
# The placements the tests' credentials take from their formats' plug-ins.
siros-mdoc = { workspace = true }
siros-sdjwt = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }

[lints]
workspace = true
