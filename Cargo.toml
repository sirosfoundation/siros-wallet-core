[workspace]
resolver = "3"
members = [
    # The wallet core, presentation side — ported from siros-dc-matcher PRs #54/#55.
    "crates/siros-codec",
    "crates/siros-credential",
    "crates/siros-dcql",
    "crates/siros-derive-internals",
    "crates/siros-display",
    "crates/siros-explain",
    "crates/siros-explain-derive",
    "crates/siros-i18n",
    "crates/siros-i18n-derive",
    "crates/siros-cldr",
    "crates/siros-mdoc",
    "crates/siros-oid4vp",
    "crates/siros-presentation",
    "crates/siros-sdjwt",
    "crates/siros-syntax",
    "crates/siros-transaction-data",
    "crates/siros-trust",
    "crates/siros-wallet-state",
    "crates/siros-zkp-req",
    "crates/siros-zkp-catalogues",
    # The WMP engine core — planned; stubs until the spike (S0) opens.
    "crates/wmp-core",
    "crates/engine-ports",
    "crates/engine-core",
    "crates/engine-adapter-sdk",
    "crates/engine-adapter-server",
    "crates/engine-adapter-wasm",
    "crates/engine-conformance",
]

[workspace.package]
edition = "2021"
license = "BSD-2-Clause"
repository = "https://github.com/sirosfoundation/siros-wallet-core"
authors = ["SIROS Foundation"]
# The floor of every crate: aes 0.9.4 declares 1.89. Checked by the msrv CI job.
rust-version = "1.89"

[workspace.dependencies]
siros-codec = { path = "crates/siros-codec" }
siros-credential = { path = "crates/siros-credential" }
siros-dcql = { version = "0.12.0", path = "crates/siros-dcql" }
siros-derive-internals = { path = "crates/siros-derive-internals" }
siros-display = { path = "crates/siros-display", default-features = false }
siros-explain = { path = "crates/siros-explain" }
siros-explain-derive = { path = "crates/siros-explain-derive" }
siros-i18n = { path = "crates/siros-i18n", default-features = false }
siros-i18n-derive = { path = "crates/siros-i18n-derive" }
siros-mdoc = { path = "crates/siros-mdoc" }
siros-oid4vp = { path = "crates/siros-oid4vp" }
siros-presentation = { path = "crates/siros-presentation", default-features = false }
siros-sdjwt = { path = "crates/siros-sdjwt" }
siros-syntax = { path = "crates/siros-syntax" }
siros-transaction-data = { path = "crates/siros-transaction-data", default-features = false }
siros-trust = { path = "crates/siros-trust", default-features = false }
siros-wallet-state = { path = "crates/siros-wallet-state" }
siros-zkp-req = { path = "crates/siros-zkp-req" }
siros-zkp-catalogues = { path = "crates/siros-zkp-catalogues", default-features = false }

serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
ciborium = "0.2"
# Hash sets and maps for every crate that links into an embedded or wasm
# artifact. std's default hasher seeds itself from a platform `random_get`,
# which embedded hosts may not provide; FxHash needs no seed.
rustc-hash = "2.1.3"
# Iterator adapters. Only those without a hash map: std's hasher seeds itself
# from a `random_get` the embedded hosts lack.
itertools = "0.12.1"
# Every error type derives `Display` and `Error` with it.
thiserror = "2.0.21"
# `check` of siros-explain and siros-i18n: each derived error's and statement's row, gathered when
# the test binary starts.
inventory = "0.3"
# The parser and code generation of siros-explain-derive, siros-i18n-derive and
# siros-derive-internals.
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.9", features = ["full"] }
# UAX #15: MessageFormat 2 compares names and variant keys in NFC.
unicode-normalization = { version = "0.1.26", default-features = false }
# Unicode general categories: the letters that decide a currency symbol's spacing.
icu_properties = { version = "=2.4.0", default-features = false, features = ["compiled_data"] }
# Test-only: ICU4X 2.4 and its compiled CLDR 49.0.0 data, siros-i18n's oracle.
icu_plurals = { version = "=2.4.0", features = ["compiled_data"] }
icu_decimal = { version = "=2.4.0", features = ["compiled_data"] }
icu_datetime = { version = "=2.4.0", features = ["compiled_data"] }
icu_calendar = { version = "=2.4.0", features = ["compiled_data"] }
icu_time = { version = "=2.4.0", features = ["compiled_data"] }
icu_locale_core = "=2.4.0"
icu_experimental = { version = "=0.7.0", features = ["compiled_data"] }
fixed_decimal = "=0.7.3"
writeable = "0.6.3"
# Test-only: a seeded generator.
rand = "0.9.2"
rand_chacha = "0.9.0"

# clippy.toml names the std methods that panic on an argument. The tests may
# call them; each crate root denies them outside its tests.
[workspace.lints.clippy]
disallowed_methods = "allow"

# Host and mobile builds. Unwinding, deliberately: UniFFI turns panics into
# errors with `catch_unwind`, which cannot work without it — an aborting build
# silently removes the error handling the generated bindings appear to provide,
# and makes the blast radius of any bug the whole application rather than one
# failed call. That matters most for a library fed DCQL written by a verifier,
# which is untrusted input arriving over the network.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "unwind"
strip = "debuginfo"

# The zkp_req tests sign and verify ES256 and X.509 by the hundred. Without
# optimisation, these crates take most of the suite's time: the refusal table
# runs in 1.00 s as built by default and in 0.21 s with this, measured back to
# back on the same machine load.
[profile.dev.package.p256]
opt-level = 3
[profile.dev.package.primeorder]
opt-level = 3
[profile.dev.package.elliptic-curve]
opt-level = 3
[profile.dev.package.crypto-bigint]
opt-level = 3
[profile.dev.package.ecdsa]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
