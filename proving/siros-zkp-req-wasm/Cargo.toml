[package]
name = "siros-zkp-req-wasm"
version = "0.11.0"
description = "The zkp_req parts of the browser presenter: the Longfellow and Vega provers and the vp_token"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
siros-dcql = { workspace = true }
siros-mdoc = { workspace = true }
siros-oid4vp = { workspace = true }
siros-trust = { workspace = true }
siros-codec = { workspace = true }
zeroize = "1.8.1"
js-sys = "0.3.77"
serde_json = "1"
siros-zkp-req = { workspace = true }
siros-zkp-catalogues = { workspace = true }
siros-zkp-backend-longfellow = { workspace = true }
siros-zkp-backend-vega = { workspace = true }
serde = { workspace = true }
serde-wasm-bindgen = "0.6.5"
serde_bytes = "0.11.19"
wasm-bindgen = "0.2.100"

[lints]
workspace = true


[dev-dependencies]
# The presenter chain test drives the same fixtures the e2e does: the
# workspace dep carries credential+request; the dev side adds the
# test-fixtures feature (features add up, the path stays canonical).
siros-zkp-catalogues = { workspace = true, features = ["test-fixtures"] }
wasm-bindgen-test = "0.3"
