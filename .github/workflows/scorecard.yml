# OpenSSF Scorecard — supply-chain security posture assessment.
name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read
  actions: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Scorecard analyses public source: on a private repository every
      # run dies in the ListCommits GraphQL query ("Resource not
      # accessible by integration") — 17/17 runs before this gate
      # failed that way. The gate skips the analysis until the day the
      # repository goes public.
      - name: Gate on repository visibility (Scorecard analyses public source)
        id: visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          visibility="$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)"
          echo "visibility=$visibility" >> "$GITHUB_OUTPUT"
          echo "the repository is $visibility — $( \
            [ "$visibility" = public ] && echo running the analysis \
            || echo skipping it \
          )"

      - name: Run Scorecard
        if: steps.visibility.outputs.visibility == 'public'
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF
        if: steps.visibility.outputs.visibility == 'public'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
