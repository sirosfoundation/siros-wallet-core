name: CI

on:
  push:
    branches: [main]
  # No branch filter. `branches: [main]` silently gives a stacked pull request
  # — one targeting another feature branch rather than main — no CI at all:
  # not a failure, not a skip, simply no checks, which reads as "nothing to
  # run" rather than "nothing was run".
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Checkout engine-vectors (sibling checkout)
        # The conformance runner loads the vectors from the sibling
        # checkout (docs/runner-contract.md): with it present, the
        # repository's scenarios run in CI, not just the self-tests.
        # The vectors repository is public — the clone needs no token.
        run: git clone --depth 1 https://github.com/sirosfoundation/engine-vectors.git "$(dirname "$GITHUB_WORKSPACE")/engine-vectors"
      - name: Checkout wmp (sibling checkout)
        # wmp-core's conformance harness loads the wmp repository's
        # vectors from the sibling checkout the same way
        # (crates/wmp-core/tests/conformance.rs): without it the four
        # vector tests panic on the missing directory. The wmp
        # repository is the specification (with vectors/); go-wmp is
        # the Go implementation and carries none. Public — no token.
        run: git clone --depth 1 https://github.com/sirosfoundation/wmp.git "$(dirname "$GITHUB_WORKSPACE")/wmp"
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test --workspace --all-features

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/rust-toolchain
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # The clippy steps enforce the lints each crate root denies outside its
      # tests; the script fails on a root without them and on an allow of them
      # outside the tests, and finds the panics no lint covers.
      - name: No panic outside the tests
        run: python3 scripts/check_panic_sites.py Cargo.toml proving/Cargo.toml

  wasm:
    name: WASM (browser engine, Node)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/rust-toolchain
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install wasm-pack
        run: curl -sSLf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
      - name: The browser smoke (Node's JS event loop)
        run: wasm-pack test --node crates/engine-adapter-wasm

  proving:
    name: Proving workspace
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proving
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: proving
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      # Real proofs of both systems, verified by the Verifier.
      - run: scripts/fetch-artifacts.sh
      - run: cargo test --locked --release -p siros-zkp-proving-e2e -- --ignored

  browser:
    name: Build the browser presenter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proving
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/rust-toolchain
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: proving
      # zstd-sys compiles C for wasm32 with clang.
      - run: cargo clippy --locked -p siros-zkp-req-wasm --target wasm32-unknown-unknown -- -D warnings
      - run: cargo build --locked -p siros-zkp-req-wasm --target wasm32-unknown-unknown --release

  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Both mechanisms are needed, and they do different jobs. `rustup
      # toolchain install` here *installs* 1.82. RUSTUP_TOOLCHAIN (exported
      # below) is what makes cargo use it: rust-toolchain.toml pins the exact
      # CI toolchain and overrides the installed default, so without the env
      # var this job would install 1.82 and then quietly build on the pinned
      # one — passing while checking nothing.
      - name: Install the MSRV toolchain
        run: |
          rustup toolchain install 1.82 --profile minimal
          echo "RUSTUP_TOOLCHAIN=1.82" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # The floor covers the library crates with their default features and
      # the `wallet`/`chain` feature pairs, as the architecture contract
      # requires. Dev-only feature combinations that need a newer toolchain
      # are excluded here on purpose.
      #
      # The engine crates are excluded on purpose too: their pinned crypto
      # stack (kryptering 0.7 → bp256 → elliptic-curve 0.14 → base16ct
      # 1.0.0) and the UniFFi toolchain (textwrap → smawk 0.3.3) resolve
      # dependencies whose manifests cargo 1.82 cannot parse, so the
      # floor never covered them — it covers the library crates
      # (`rust-version` in Cargo.toml), which this checks.
      - name: The library crates on the floor
        run: >
          cargo check --workspace --locked
          --exclude engine-core
          --exclude engine-adapter-sdk
          --exclude engine-adapter-server
          --exclude engine-adapter-wasm
          --exclude engine-conformance
      # TODO(msrv): confirm the exact feature matrix against the ported crates
      # and tighten this job; non-blocking on import.
      - name: Feature matrix on the MSRV
        run: cargo check --locked -p siros-transaction-data -p siros-trust --features wallet,chain
        continue-on-error: true

  kotlin-smoke:
    name: UniFFI async smoke (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Fetch the Kotlin toolchain
        run: |
          curl -sL -o /tmp/kotlinc.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q /tmp/kotlinc.zip -d /tmp
          curl -sL -o /tmp/coroutines.jar https://repo1.maven.org/maven2/org/jetbrains/kotlinx/kotlinx-coroutines-core-jvm/1.8.1/kotlinx-coroutines-core-jvm-1.8.1.jar
          curl -sL -o /tmp/jna.jar https://repo1.maven.org/maven2/net/java/dev/jna/jna/5.14.0/jna-5.14.0.jar
          curl -sL -o /tmp/stdlib.jar https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/2.0.21/kotlin-stdlib-2.0.21.jar
      - run: make kotlin-smoke
        env:
          KOTLINC: /tmp/kotlinc/bin/kotlinc
          COROUTINES_JAR: /tmp/coroutines.jar
          JNA_JAR: /tmp/jna.jar
          STDLIB_JAR: /tmp/stdlib.jar

  swift-bindings:
    name: UniFFI bindings type-check (Swift)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/rust-toolchain
        with:
          targets: aarch64-apple-ios
      - run: cargo build -p engine-adapter-sdk --target aarch64-apple-ios
      - name: Build the host library (the bindgen source)
        # uniffi-bindgen reads the host's cdylib, which the
        # aarch64-apple-ios build above does not produce — the
        # target/ build goes to target/aarch64-apple-ios/debug.
        run: cargo build -p engine-adapter-sdk
      - run: cargo run -p engine-adapter-sdk --features bindgen --bin uniffi-bindgen -- generate --library target/debug/libengine_adapter_sdk.dylib --language swift --out-dir bindings/swift
      - name: The generated Swift compiles and carries the async surface
        # The macOS runner carries swiftformat, which uniffi-bindgen uses
        # to auto-format the generated Swift (a Linux runner, or none,
        # prints the "Unable to auto-format" warning and writes the raw
        # template). The patterns tolerate both: [[:space:]]* where the
        # raw template runs the tokens together.
        run: |
          swiftc -typecheck bindings/swift/engine_adapter_sdk.swift \
            -Xcc -fmodule-map-file=bindings/swift/engine_adapter_sdkFFI.modulemap
          grep -Eq "func requestTxCode\(flowId: String\)[[:space:]]*async throws" bindings/swift/engine_adapter_sdk.swift
          grep -Eq "func send\(request: HttpRequest\)[[:space:]]*async throws" bindings/swift/engine_adapter_sdk.swift
          grep -Eq "func runPreAuthorizedFlow\(http: HttpClient, host: Host, issuerUrl: String\)[[:space:]]*async throws" bindings/swift/engine_adapter_sdk.swift

  # ── The mobile packaging recipes (AAR / XCFramework) ────────────────────
  #
  # The release workflow (release.yml) builds the artifacts on tags; these
  # jobs keep the recipes themselves honest on every push — the
  # engine-switching table's "Makefile targets defined, need CI" — so a
  # change that breaks the packaging fails the pull request, not the
  # release. The assertions read what the recipes produce, the same way
  # the SDKs consume them.

  xcframework:
    name: XCFramework packaging
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/rust-toolchain
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@e18b497796c12c097a38e9edb9d0641fb99eee32 # v2
      - name: Build the host library (the bindgen source)
        run: cargo build -p engine-adapter-sdk
      - run: make bindings-swift
      - name: The XCFramework recipe
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        run: |
          make xcframework
          # The product the SDKs link: two static-library slices (the
          # device and the simulator) and the FFI headers, named by
          # whatever xcodebuild names them (the slice directory depends
          # on the architectures it finds in the archives).
          test -d target/xcframework/engine_adapter_sdk.xcframework
          test "$(find target/xcframework -name 'libengine_adapter_sdk.a' | wc -l)" = 2
          test "$(find target/xcframework -name 'engine_adapter_sdkFFI.h' | wc -l)" -ge 1
          test "$(find target/xcframework -name 'module.modulemap' | wc -l)" -ge 1

  aar:
    name: AAR packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/rust-toolchain
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@e18b497796c12c097a38e9edb9d0641fb99eee32 # v2
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      - uses: android-actions/setup-android@40fd30fb8d7440372e131f6f5d1809ec01dcd369 # v4
        with:
          api-level: 28
          ndk-version: "27.2.12479018"
      - name: The AAR and POM recipes
        run: |
          make aar pom VERSION=0.0.0-ci
          # The artifact the SDKs consume (the Maven coordinate
          # org.siros:siros-wallet-core, JNA provided transitively by the
          # POM): the native .so per ABI, the manifest, an empty
          # classes.jar — the UniFFI Kotlin bindings are vendored source.
          unzip -l target/siros-wallet-core-0.0.0-ci.aar | grep -q 'AndroidManifest.xml'
          unzip -l target/siros-wallet-core-0.0.0-ci.aar | grep -q 'jni/arm64-v8a/libengine_adapter_sdk.so'
          unzip -l target/siros-wallet-core-0.0.0-ci.aar | grep -q 'jni/armeabi-v7a/libengine_adapter_sdk.so'
          unzip -l target/siros-wallet-core-0.0.0-ci.aar | grep -q 'jni/x86_64/libengine_adapter_sdk.so'
          # The POM names the coordinate and the JNA dependency it carries.
          grep -q '<groupId>org.siros</groupId>' target/siros-wallet-core-0.0.0-ci.pom
          grep -q '<artifactId>siros-wallet-core</artifactId>' target/siros-wallet-core-0.0.0-ci.pom
