# cargo-deny configuration. Run: cargo deny check
# Mirrors the policy of siros-verifier-core: BSD-2-Clause compatible licenses
# only, no OpenSSL, advisories fail the build.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
  "BSD-2-Clause",
  "BSD-3-Clause",
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CC0-1.0",
]
# Everything the org ships is BSD-2-Clause; permissive deps are fine. Copyleft
# is not: fail the build on anything else.
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
  # Prefer rustls; OpenSSL drags a build script and a system dependency into
  # every cross build.
  { crate = "openssl", reason = "rustls only" },
  { crate = "openssl-sys", reason = "rustls only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
